spring.h2.console.enabled=true

# JWT Properties — override APP_JWT_SECRET env var in production
app.jwtSecret=${APP_JWT_SECRET:PPMToolSecretKeyToGenJWTs}
app.jwtExpirationInMs=3600000

spring.jpa.show-sql=true

# H2 in-memory database (default for development)
# To use MySQL instead, set DB_URL, DB_USER, DB_PASSWORD environment variables
spring.datasource.url=${DB_URL:jdbc:h2:mem:ppmtooldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update